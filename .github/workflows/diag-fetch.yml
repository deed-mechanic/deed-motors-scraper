name: 一時診断（UNEGUI.MN取得確認）
on:
  push:
    paths:
      - '.github/workflows/diag-fetch.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright playwright-stealth beautifulsoup4 lxml requests
      - run: python3 -m playwright install --with-deps chromium
      - name: 診断
        run: |
          python3 - <<'PY'
          import sys, re, requests
          sys.path.insert(0, '.')
          from scripts import scraper as s
          from playwright.sync_api import sync_playwright
          from playwright_stealth import Stealth
          msgs = []
          try:
              r = requests.get(s.build_url('toyota/harrier'), headers={'User-Agent': s.USER_AGENT}, timeout=30)
              msgs.append(f"requests: status={r.status_code} len={len(r.text)} cf={'Just a moment' in r.text[:5000]}")
          except Exception as e:
              msgs.append(f"requests error: {e}")
          with Stealth().use_sync(sync_playwright()) as p:
              b = p.chromium.launch(headless=True)
              pg = b.new_page(user_agent=s.USER_AGENT, viewport={'width': 1280, 'height': 900}, locale='mn-MN')
              s._page = pg
              for path in ['toyota/harrier', 'toyota/aqua']:
                  try:
                      resp = pg.goto(s.build_url(path), wait_until='load', timeout=45000)
                      pg.wait_for_timeout(2500)
                      h = pg.content()
                      n_cards = h.count('data-component=' + chr(34) + 'BigAdCard' + chr(34))
                      t = re.search(r'<title>(.*?)</title>', h, re.S)
                      msgs.append(f"playwright {path}: http={resp.status if resp else None} url={pg.url} len={len(h)} title={(t.group(1).strip()[:60] if t else None)} cf={'Just a moment' in h[:5000] or 'challenges.cloudflare.com' in h[:20000]} cards={n_cards}")
                  except Exception as e:
                      msgs.append(f"playwright {path} error: {str(e)[:200]}")
              b.close()
          for m in msgs:
              print(m)
              print(f"::notice title=診断::{m}")
          PY
