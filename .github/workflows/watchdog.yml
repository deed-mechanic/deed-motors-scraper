name: 市場データ鮮度チェック（見張り役）
# 取得はローカルPC（scripts/run_daily_local.ps1）が毎日0:00(UTC+8)に行う。
# ここでは取得せず、価格データが古い/空でないかだけを確認し、異常なら失敗にする。
# 失敗するとGitHubからメール通知が届く（Actionsの失敗通知）。
on:
  schedule:
    # GitHubの定時実行は混雑で数時間遅れる（実測: 02:00 UTC指定でも 09〜10時 UTC に起動）。
    # 正時を避けて指定し、遅れても判定が狂わないよう下の MAX_AGE_H を余裕のある値にしている
    - cron: '37 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/watchdog.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: データ鮮度・件数の確認
        run: |
          python3 - <<'PY'
          import json, time, sys, calendar
          # 取得は毎日0:00(UTC+8)開始で、完了は0:30〜3:00頃。見張りの起動は遅れることがあり（最大で
          # 取得完了の約18時間後）、正常でも 9〜18 時間経過で判定される。
          # 1日分の取得が丸ごと飛ぶと 33 時間以上になるので、その中間の 30 時間を上限にする
          MAX_AGE_H = 30
          MIN_RECORDS = 1500  # 通常は約3,500件
          MIN_MODELS = 100    # 通常は約140車種
          with open('scripts/price_db.json', encoding='utf-8-sig') as f:
              d = json.load(f)
          # 取得完了時刻(updated_at)はローカルPCの時刻＝UTC+8。手動でのコード修正コミットなどに
          # 惑わされないよう、コミット時刻ではなくこの値で鮮度を見る
          ts = calendar.timegm(time.strptime(d['updated_at'], '%Y-%m-%d %H:%M')) - 8 * 3600
          age_h = (time.time() - ts) / 3600
          msg = f"データ取得完了から {age_h:.1f} 時間 / {d['total_models']}車種 {d['total_records']}件 (updated_at={d['updated_at']} UTC+8)"
          print(msg)
          problems = []
          if d['total_models'] < MIN_MODELS:
              problems.append(f"車種数が {d['total_models']} と異常に少ないです（下限 {MIN_MODELS}）")
          if age_h > MAX_AGE_H:
              problems.append(f"市場データが {age_h:.0f} 時間更新されていません（上限 {MAX_AGE_H} 時間）。ローカルPCの日次取得が止まっている可能性があります")
          if d['total_records'] < MIN_RECORDS:
              problems.append(f"件数が {d['total_records']} 件と異常に少ないです（下限 {MIN_RECORDS} 件）")
          for p in problems:
              print(f"::error title=市場データ異常::{p}")
          sys.exit(1 if problems else 0)
          PY
