<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДЭЭД МОТОРС — Баталгаа</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI","Arial",sans-serif;background:#eceff3;color:#222;font-size:14px;}
header{background:#fff;border-bottom:4px solid #C8102E;padding:8px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
header img{height:46px;}
header h1{font-size:17px;margin:0;flex:1;color:#003087;}
header button{border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px;}
.b-red{background:#C8102E;color:#fff;} .b-gray{background:#e4e7ee;color:#003087;}
.layout{display:grid;grid-template-columns:minmax(420px,520px) 1fr;gap:16px;padding:16px;align-items:start;}
@media(max-width:1000px){.layout{grid-template-columns:1fr;}}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.12);}
.card h2{margin:0 0 10px;font-size:15px;color:#003087;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.card h2 .stars{color:#e0a800;font-size:16px;letter-spacing:1px;white-space:nowrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid2 .full{grid-column:1/3;}
.grid2 label{font-size:11px;color:#666;display:block;}
.grid2 input,.grid2 select{width:100%;padding:7px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;background:#fff;}
.btns{display:flex;flex-wrap:wrap;gap:6px;}
.opt{border:1.5px solid #ccd;background:#fafbff;border-radius:8px;padding:9px 12px;cursor:pointer;font-size:13px;user-select:none;}
.opt.on{background:#003087;color:#fff;border-color:#003087;}
.opt.on.warn{background:#e07b00;border-color:#e07b00;}
.opt.on.bad{background:#C8102E;border-color:#C8102E;}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap;}
.row .lbl{width:120px;font-weight:700;font-size:13px;flex-shrink:0;}
.note{font-size:11px;color:#777;margin-top:4px;}
.editor{background:#f3f6fc;border:1.5px solid #003087;border-radius:8px;padding:10px;margin-top:8px;}
.editor h3{margin:0 0 6px;font-size:13px;color:#003087;}
.kbd{display:none;background:#f3f6fc;border:1.5px solid #003087;border-radius:8px;padding:8px;margin-top:6px;}
.kbd.show{display:block;}
.kbd-row{white-space:nowrap;}
.kbd .k{display:inline-block;min-width:32px;text-align:center;padding:8px 6px;margin:2px;border:1.5px solid #99a;border-radius:6px;background:#fff;cursor:pointer;font-weight:700;user-select:none;}
.kbd .k:active{background:#dde6ff;}
.kbtn{margin-top:4px;padding:5px 10px;font-size:12px;border:1.5px solid #003087;color:#003087;background:#fff;border-radius:6px;cursor:pointer;font-weight:700;}
svg .z{fill:#fff;stroke:#446;stroke-width:1.5;cursor:pointer;}
svg .z:hover{fill:#eef3ff;}
svg .z.sel{stroke:#C8102E;stroke-width:3;}
svg .z.l1{fill:#fff3b0;} svg .z.l2{fill:#ffc266;} svg .z.l3{fill:#ff8a80;}
svg text{pointer-events:none;font-size:9.5px;fill:#334;text-anchor:middle;}
svg .mark{font-size:9px;font-weight:700;fill:#a00;}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #446;vertical-align:-2px;margin:0 3px 0 8px;}

/* ===== Баталгаа ===== */
.sheet{background:#fff;width:100%;max-width:794px;min-height:calc(min(100vw,794px)*1.414);margin:0 auto 16px;padding:34px 40px;box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;display:flex;flex-direction:column;}
.frame{position:absolute;inset:10px;border:3px double #b8912f;border-radius:6px;pointer-events:none;}
.logo{text-align:center;}
.logo img{height:78px;}
.title{text-align:center;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:22px;color:#a8801f;margin:10px 0 2px;line-height:1.3;}
.subtitle{text-align:center;font-weight:700;letter-spacing:2px;margin-bottom:12px;font-size:14px;color:#003087;}
.lead{font-size:12px;line-height:1.7;margin:0 0 12px;}
.sh{text-align:center;font-weight:700;border-top:1px solid #999;border-bottom:1px solid #999;padding:4px;margin:8px 0;font-size:13px;}
.spec{font-size:13px;}
.spec .r{display:flex;gap:14px;border-bottom:1px solid #ccc;padding:4px 0;}
.spec .c{display:flex;flex:1;gap:8px;min-width:0;}
.spec b{width:118px;font-weight:600;flex-shrink:0;color:#444;} .spec span{flex:1;word-break:break-word;min-width:0;}
.qg .item{display:grid;grid-template-columns:118px 116px 1fr;gap:8px;align-items:center;border-bottom:1px solid #bbb;padding:9px 0;font-size:12px;line-height:1.5;}
.qg .item b{font-size:13px;}
.qg .stars{color:#e0a800;font-size:19px;letter-spacing:1px;white-space:nowrap;}
.qg .stars i{color:#d5d5d5;font-style:normal;}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-top:14px;font-size:13px;}
.foot div{white-space:normal;border-bottom:1px solid #ccc;padding-bottom:3px;min-width:0;word-break:break-word;}
.foot small{display:block;color:#666;font-size:10.5px;}
.disc{margin:auto 0 0;padding:16px 0 0 16px;font-size:10.5px;color:#444;line-height:1.6;}
.spacer{flex:1;min-height:12px;}
.p2title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:13px;border-bottom:2px solid #003087;padding-bottom:6px;margin-bottom:10px;}
.p2title img{height:36px;}
.p2grid{display:grid;grid-template-columns:1fr 215px;gap:10px;}
.box{border:1px solid #888;padding:6px;font-size:10.5px;line-height:1.55;margin-bottom:6px;}
.box h4{margin:0 0 3px;font-size:11px;background:#e9eef8;padding:2px 4px;}
.box ul{margin:0;padding-left:14px;}
.legend{font-size:9.5px;margin-top:4px;line-height:1.5;}
.mini table{width:100%;border-collapse:collapse;font-size:10px;}
.mini td,.mini th{border:1px solid #999;padding:2px 3px;text-align:left;}
.mini th{background:#eef;}
@media print{
  body{background:#fff;} header,.editorcol{display:none!important;}
  .layout{display:block;padding:0;}
  .sheet{box-shadow:none;margin:0;width:210mm;max-width:none;height:297mm;min-height:0;page-break-after:always;padding:14mm 15mm;overflow:hidden;}
  @page{size:A4;margin:0;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>

function lookupJaai(km,months){
  let r=0;for(let i=0;i<JAAI_MILEAGE_ROWS.length;i++){r=i;if(km/1000<=JAAI_MILEAGE_ROWS[i])break;}
  let c=0;for(let j=0;j<JAAI_MONTH_BANDS.length;j++){c=j;if(months<=JAAI_MONTH_BANDS[j])break;}
  return JAAI_TABLE[r][c];
}
/* 走行距離の減点段階：加減表が0以上→0 / -1〜-29→1 / -30以下→2（機関★から減算） */
function mileageTier(){
  const km=parseInt(String(S.info.km).replace(/[^0-9]/g,""))||0;
  const y=parseInt(S.info.year)||0;
  if(!km||!y) return {tier:0,known:false};
  const months=Math.max(1,(new Date().getFullYear()-y)*12);
  const v=lookupJaai(km,months);
  return {tier:v>=0?0:v>-30?1:2,known:true,km,months};
}

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.info)S=Object.assign(freshState(),d);}catch(e){}
  try{
    if(location.hash.length>1){
      const p=JSON.parse(decodeURIComponent(location.hash.slice(1)));

      // 既存ツールの車名（自由入力）→ メーカー選択に変換
      const words=(p.name||"").split(/\s+/).filter(Boolean);
      const mk=MAKERS.find(m=>words[0]&&m[1].toLowerCase()===words[0].toLowerCase());
      if(mk){S.info.maker=mk[0];S.info.grade=words.slice(1).join(" ");}
      else if(words.length){S.info.maker="__other__";S.info.custom=words.join(" ");}
      if(p.color)S.info.color=mapColor(p.color);
      for(const k of ["year","km","model","vin","reg","date"]) if(p[k]) S.info[k]=p[k];
      if(p.inspector){if(INSPECTORS.includes(p.inspector))S.info.inspector=p.inspector;else S.info.inspectorFree=p.inspector;}

// 「目立つ傷（へこみ・波うち・錆など、中・大サイズ）」＝1件3点以上は majorCount として重く数え、
// 「軽微な傷（スリ傷等、小サイズ）」は minor として1件あたりの影響を小さく抑える。
// → 軽微な傷が何箇所にあっても★4程度に収まり、目立つへこみが3箇所以上あれば★2程度まで下がる。
const EXT_MAJOR_THRESHOLD=3;
function extBreakdown(){
  let majorCount=0, minorSum=0;
  const add=v=>{ if(v>=EXT_MAJOR_THRESHOLD) majorCount++; else minorSum+=v; };
  for(const k in PANELS) add(panelPts(S.panels[k]));
  add(GLASS.find(g=>g[0]===S.glass)[2]);
  for(const k in WHEELS) add(WHEEL_ST.find(w=>w[0]===S.wheels[k].st)[2]+tireLvl(S.wheels[k].tire)*0.5);
  return {majorCount,minorSum};
}
function extPts(){
  const {majorCount,minorSum}=extBreakdown();
  return majorCount*4 + minorSum*0.3;
}
const toStar=(t,lim)=>{for(let i=0;i<lim.length;i++)if(t<=lim[i])return 5-i;return 1;};
function starExt(){return toStar(extPts(),[1,4,8,14]);}
function starInt(){let t=0;for(const[k]of INT_AREAS)t+=INT_ST.find(x=>x[0]===S.int[k])[2];return toStar(t,[0,1,3,6]);}
function starEng(){ if(S.eng==="repair")return 1;
  const base=S.eng==="ok"?5:3; return Math.max(1,base-mileageTier().tier); }
function starFrm(){return S.frm==="none"?5:S.frm==="part"?3:1;}
function starOth(){let s=5;if(S.oth.flood)s=Math.min(s,1);if(S.oth.nodrive)s=Math.min(s,2);if(S.oth.safety)s=Math.max(1,s-2);return s;}

function panelList(f){return Object.keys(PANELS).filter(k=>S.panels[k]&&S.panels[k].size&&S.panels[k].types.length&&f(S.panels[k]));}
function extComment(){
  const n=panelList(()=>true).length, big=panelList(p=>p.size==="l").length, rust=panelList(p=>p.types.includes("Зэв")).length;
  let s = n===0?"Гадна талд анхаарал татахуйц зураас, хонхор байхгүй. ":
    big?`Өргөн хүрээтэй зураас, хонхор ${big} хэсэгт байна. `:`Жижиг зураас, хонхор ${n} хэсэгт байна. `;
  if(rust)s+=`Зэв ${rust} хэсэгт илэрсэн. `;
  if(S.glass==="chip")s+="Урд шилэнд чулуу хатгасан мөр бий. ";
  if(S.glass==="crack")s+="Урд шил хагарсан. ";
  const ws=Object.keys(WHEELS).filter(k=>S.wheels[k].st!=="none").length;
  if(ws)s+=`${ws} дугуйны дискэнд зураас бий.`;
  return s.trim();
}
function intComment(){
  const bad=INT_AREAS.filter(([k])=>S.int[k]==="heavy").map(a=>a[1]);
  const lt=INT_AREAS.filter(([k])=>S.int[k]==="light").map(a=>a[1]);

}
function engComment(){
  const m=mileageTier();
  let s=S.eng==="ok"?"Гол механизмд асуудалгүй. ":S.eng==="part"?"Тос алдагдах, бүрхүүл урагдах зэрэг зарим асуудал бий. ":"Засвар хийх шаардлагатай хэсэг бий. ";
  if(m.known)s+=m.tier===0?"Явсан зам үйлдвэрлэсэн оныхоо хувьд хэвийн буюу цөөн.":m.tier===1?"Явсан зам үйлдвэрлэсэн оныхоо хувьд арай их.":"Явсан зам үйлдвэрлэсэн оныхоо хувьд их.";
  return s.trim();
}
function frmComment(){return S.frm==="none"?"Рамд засварын түүх байхгүй.":S.frm==="part"?"Рамын зарим хэсэгт засвар хийгдсэн.":"Засварын түүхтэй.";}
function othComment(){const a=OTH.filter(([k])=>S.oth[k]).map(o=>o[1]);return a.length?"Тусгай хасалт: «"+a.join("», «")+"».":"Тусгай хасалтад хамаарах зүйл байхгүй.";}

    .replace(/ピックアップ/g,"Пикап").replace(/シリーズ/g," цуврал").replace(/系/g,"").replace(/（/g," (").replace(/）/g,")").replace(/\s+/g," ").trim();
}

}

function lines(n){const w=n.split(" ");if(w.length===1)return [n];if(w.length===2)return w;return [w.slice(0,2).join(" "),w.slice(2).join(" ")];}
function renderSvg(){
  let h="";
  const lvl=k=>{const p=S.panels[k];if(!p||!p.size||!p.types.length)return "";return " l"+{s:1,m:2,l:3}[p.size];};
  for(const k in PANELS){const p=PANELS[k];
    const pp=S.panels[k],mark=pp&&pp.size&&pp.types.length?pp.types.map(t=>TYPES.find(x=>x[0]===t)[1]).join(" ")+" · "+SIZE_SHORT[pp.size]:"";
    const ls=lines(p.n),cy=p.y+p.h/2-(ls.length-1)*5-(mark?5:0);
    h+=`<rect class="z${lvl(k)}${sel===k?" sel":""}" data-z="${k}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.r||6}"/>`
      +ls.map((t,i)=>`<text x="${p.x+p.w/2}" y="${cy+i*11}">${t}</text>`).join("")
      +(mark?`<text class="mark" x="${p.x+p.w/2}" y="${cy+ls.length*11+2}">${mark}</text>`:"");}
  const gl=S.glass==="none"?"":S.glass==="chip"?" l1":" l3";
  h+=`<path class="z${gl}${sel==="glass"?" sel":""}" data-z="glass" d="M128 150 L232 150 L222 192 L138 192 Z"/><text x="180" y="169">Урд шил</text><text class="mark" x="180" y="182">${S.glass==="chip"?"чулууны мөр":S.glass==="crack"?"хагарсан":""}</text>`;
  for(const k in WHEELS){const w=WHEELS[k],st=S.wheels[k].st;
    h+=`<circle class="z${sel===k?" sel":""}" data-z="${k}" cx="${w.cx}" cy="${w.cy}" r="19" style="fill:${st==="none"?"#3a3a3a":st==="part"?"#c9a800":"#c62828"}"/>`
      +`<text x="${w.cx}" y="${w.cy+3}" style="fill:#fff;font-size:9px">${S.wheels[k].tire!==""?S.wheels[k].tire+"%":"Дугуй"}</text>`;}
  const svg=document.getElementById("carSvg");svg.innerHTML=h;
  svg.querySelectorAll("[data-z]").forEach(e=>e.onclick=()=>{sel=e.dataset.z;renderSvg();renderEditor();});
}

function renderAll(){renderInfo();renderSvg();renderEditor();renderInt();
  pickBtns(document.getElementById("engBtns"),ENG_ST,S.eng,v=>{S.eng=v;save();renderAll();});
  pickBtns(document.getElementById("frmBtns"),FRM_ST,S.frm,v=>{S.frm=v;save();renderAll();});
  renderOth();renderEngNote();renderCert();renderStars();save();}
load();renderAll();
</script>
